name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    name: Generate GitHub contribution snake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Girivardhan-Reddy
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=%2300FF41&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D4FF&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      - name: Commit generated snake files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate contribution snake"
          file_pattern: output/github-contribution-grid-snake.svg output/github-contribution-grid-snake-dark.svg
